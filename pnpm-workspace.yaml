# The Solid 2 hotkeys preview (TanStack/hotkeys#213) pulls @tanstack/hotkeys-devtools
# from pkg.pr.new. Remove once @tanstack/solid-hotkeys ships Solid 2 on npm.
blockExoticSubdeps: false
allowBuilds:
  esbuild: true
  lightningcss: true
  onnxruntime-node: true
  protobufjs: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 1.7.0
overrides:
  vite: "catalog:"
patchedDependencies:
  "@tanstack/form-core@1.33.5": patches/@tanstack__form-core@1.33.5.patch
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@lucide/solid@1.78.0"
