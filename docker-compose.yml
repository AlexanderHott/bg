services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/bg"
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID is required}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?WEBAUTHN_ORIGIN is required}
      S3_INTERNAL_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
      S3_REGION: us-east-1
      S3_BUCKET: bg-files
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_FORCE_PATH_STYLE: "true"
      NODE_OPTIONS: "--import ./instrumentation.mjs"
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_SERVICE_NAME: bg-web
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:-production}"
      OTEL_NODE_RESOURCE_DETECTORS: env,host,os,process,serviceinstance,container
      OTEL_NODE_ENABLED_INSTRUMENTATIONS: http,pg,aws-sdk,runtime-node
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_COMPRESSION: gzip
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer%20${OTEL_BEARER_TOKEN:-}"
      OTEL_EXPORTER_OTLP_TIMEOUT: "5000"
      OTEL_LOG_LEVEL: info
    expose:
      - "3000"
    networks:
      - app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10m
    # Inference peaks near 7.1 GB whatever the input size, and the scratch tmpfs counts against this.
    mem_limit: 8g
    # Uses idle cores freely but yields to web and Postgres under contention.
    cpu_shares: 256
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/bg"
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID is required}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?WEBAUTHN_ORIGIN is required}
      S3_INTERNAL_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
      S3_REGION: us-east-1
      S3_BUCKET: bg-files
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_FORCE_PATH_STYLE: "true"
      BACKGROUND_REMOVAL_MODEL_PATH: /opt/bg/models/birefnet.onnx
      BACKGROUND_REMOVAL_SCRATCH_PATH: /tmp/bg
      NODE_OPTIONS: "--import ./instrumentation.mjs"
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_SERVICE_NAME: bg-worker
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:-production}"
      OTEL_NODE_RESOURCE_DETECTORS: env,host,os,process,serviceinstance,container
      OTEL_NODE_ENABLED_INSTRUMENTATIONS: pg,aws-sdk,runtime-node
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_COMPRESSION: gzip
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer%20${OTEL_BEARER_TOKEN:-}"
      OTEL_EXPORTER_OTLP_TIMEOUT: "5000"
      OTEL_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').accessSync('/tmp/bg/ready')"]
      interval: 15s
      timeout: 2s
      retries: 40
      start_period: 10s
    tmpfs:
      - /tmp/bg:size=1g,mode=1777
    networks:
      - app

  media-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: media-worker
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/bg"
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID is required}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?WEBAUTHN_ORIGIN is required}
      S3_INTERNAL_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
      S3_REGION: us-east-1
      S3_BUCKET: bg-files
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_FORCE_PATH_STYLE: "true"
      MEDIA_SCRATCH_PATH: /var/tmp/bg-media
    volumes:
      - media_scratch:/var/tmp/bg-media
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').accessSync('/var/tmp/bg-media/ready')"]
      interval: 15s
      timeout: 2s
      retries: 10
    networks:
      - app

  postgres:
    image: postgres:18-alpine3.24
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: bg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bg"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - app

  rustfs:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: ${WEBAUTHN_ORIGIN:?WEBAUTHN_ORIGIN is required}
      RUSTFS_API_STALE_UPLOADS_CLEANUP_INTERVAL: 1h
      RUSTFS_API_STALE_UPLOADS_EXPIRY: 24h
    volumes:
      - rustfs_data:/data
    networks:
      - app

  rustfs-init:
    image: rustfs/rc:v0.1.38
    depends_on:
      - rustfs
    environment:
      RUSTFS_BUCKET: bg-files
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    volumes:
      - ./infra/rustfs/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - app

  # Temporary: copies the old MinIO volume into RustFS. Remove with minio-legacy and minio_data once migrated.
  rustfs-migrate:
    image: rustfs/rc:v0.1.38
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
      minio-legacy:
        condition: service_started
    environment:
      RUSTFS_BUCKET: bg-files
      RUSTFS_ENDPOINT: http://rustfs:9000
      LEGACY_ENDPOINT: http://minio-legacy:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    volumes:
      - ./infra/rustfs/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    networks:
      - app

  minio-legacy:
    image: cgr.dev/chainguard/minio:latest
    # The old volume was written as root by quay.io/minio/minio.
    user: "0:0"
    command: server /data
    environment:
      MINIO_ROOT_USER: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      MINIO_ROOT_PASSWORD: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    volumes:
      - minio_data:/data
    networks:
      - app

volumes:
  media_scratch:
  postgres_data:
  rustfs_data:
  minio_data:

networks:
  app:
